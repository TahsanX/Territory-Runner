# ============================================================================
# nginx reverse proxy for Territory Runner
# ============================================================================
# This is the mechanism that lets ONE droplet host several unrelated sites:
# one server block per domain, each proxying to a different localhost port.
# Add a second site by copying this file, changing server_name and the
# proxy_pass port. Nothing else conflicts.
#
#   sudo cp deploy/nginx-territory-runner.conf /etc/nginx/sites-available/territory-runner
#   sudo ln -s /etc/nginx/sites-available/territory-runner /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.com -d www.example.com
#
# Run certbot AFTER the HTTP block is live — it edits this file to add the TLS
# listener and the redirect, so do not hand-write those.
# ============================================================================

upstream territory_runner {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate limit the auth endpoints. Supabase rate-limits sign-in attempts itself,
# but this stops the traffic before it ever reaches Node.
limit_req_zone $binary_remote_addr zone=tr_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;

    # CHANGE THIS to your domain.
    server_name example.com www.example.com;

    access_log /var/log/nginx/territory-runner.access.log;
    error_log  /var/log/nginx/territory-runner.error.log;

    # GPS batches are small, but reject anything absurd at the edge.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;

    # Hashed/static assets. Served by the app, but cached hard at the edge.
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        proxy_pass http://territory_runner;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/auth/ {
        limit_req zone=tr_auth burst=5 nodelay;
        proxy_pass http://territory_runner;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://territory_runner;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Required for `secure` cookies to be set correctly behind the proxy;
        # the app reads this via `trust proxy`.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Stream responses straight through rather than buffering them.
        proxy_buffering off;
    }

    # Health check reachable without auth, for uptime monitoring. That monitor
    # also serves as the keep-warm ping that stops a free-tier Supabase project
    # pausing after 7 days of inactivity.
    location = /api/health {
        proxy_pass http://territory_runner;
        proxy_set_header Host $host;
        access_log off;
    }
}
